services:
  - type: web
    name: resume-ai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PORT
        value: 10000

